name: Test and lint
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  check:
    name: Test and lint
    # Fork PRs run untrusted code: GitHub-hosted. Everything else: celados-linux.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'celados-linux' }}
    timeout-minutes: 30

    env:
      CELADOS_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The celados-linux image has no Node. Without it `bun run` stands Bun in
      # for vitest's `#!/usr/bin/env node`, and Bun's Blob reports a different
      # content type than Node's (GitHub-hosted images ship Node).
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: celados/.github/actions/setup-celados-npm@setup-celados-npm-v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check
        run: bun run check

      - name: Publish package for testing branch
        run: bunx pkg-pr-new publish || echo "Have you set up pkg-pr-new for this repo?"
